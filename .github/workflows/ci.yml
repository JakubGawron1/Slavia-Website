name: ci

on: push

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: OpenAPI types drift check
        run: pnpm run openapi:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
        env:
          NUXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E smoke
        run: pnpm run test:e2e
        env:
          PLAYWRIGHT_START_SERVER: '1'
          CI: 'true'
