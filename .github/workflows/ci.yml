name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout Slavia-backend (matching branch)
        env:
          FE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          DEST="${GITHUB_WORKSPACE}/../Slavia-backend"
          rm -rf "$DEST"
          BRANCH="${FE_BRANCH:-main}"
          if ! git clone --depth 1 --branch "$BRANCH" https://github.com/JakubGawron1/Slavia-backend.git "$DEST" 2>/dev/null; then
            echo "Branch $BRANCH not found on Slavia-backend, falling back to main"
            git clone --depth 1 --branch main https://github.com/JakubGawron1/Slavia-backend.git "$DEST"
          fi
          echo "Slavia-backend @ $(git -C "$DEST" rev-parse --abbrev-ref HEAD) $(git -C "$DEST" rev-parse HEAD)"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: OpenAPI types drift check
        run: pnpm run openapi:check

      - name: Unit tests (Vitest)
        run: pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
        env:
          NUXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080

      - name: Bundle size report
        run: pnpm run bundle:report -- --fail
        env:
          SLAVIA_BUNDLE_JS_MAX_KB: '5500'

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E smoke
        run: >-
          pnpm exec playwright test
          e2e/smoke.spec.ts
          e2e/smoke-mobile.spec.ts
          e2e/smoke-athlete-dashboard.spec.ts
        env:
          PLAYWRIGHT_START_SERVER: '1'
          CI: 'true'
