name: ci

on:
  push:
  repository_dispatch:
    types: [slavia-shared-updated]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Slavia-shared → latest main
        run: git submodule update --init --recursive --remote Slavia-shared

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: OpenAPI types drift check
        run: pnpm run openapi:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
        env:
          NUXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E smoke
        run: pnpm run test:e2e
        env:
          PLAYWRIGHT_START_SERVER: '1'
          CI: 'true'

  vercel-deploy:
    if: github.event_name == 'repository_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK nie ustawiony — pomijam (ustaw sekret w repo dla auto-deploy na Vercel)."
            exit 0
          fi
          echo "Redeploy Vercel po Slavia-shared @ ${{ github.event.client_payload.shared_sha }}"
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
